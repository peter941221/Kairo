decision: Correctness and arbitrary-boundary handling pass; 2x2 register reuse improves the Kairo reference by about 2.5x, and WMMA tensor-core MMA reaches about 33.3 TFLOP/s on 1K. At 4K, block-level shared staging reaches 34.3--34.5 TFLOP/s, about 25% above direct WMMA, while the same staging is 5% slower at 1K. The next target is a shape-aware Blackwell MMA/TMA pipeline.
