decision: Correctness and arbitrary-boundary handling pass; 2x2 register reuse improves the Kairo reference by about 2.5x, and WMMA tensor-core MMA reaches about 33.3 TFLOP/s on 1K and 27.4 TFLOP/s on 4K. The async-copy-only variant is within measurement noise, and WMMA remains 7.6x behind cuBLAS at 4K, so the next target is a native Blackwell MMA/TMA pipeline.
