name: nvfp4-cuda-graph-pipeline
status: measured_experimental
date: 2026-09-14
hardware:
  gpu: NVIDIA GeForce RTX 5090
  compute_capability: "12.0"
  execution_environment: WSL2 Ubuntu 24.04
runtime:
  vllm_nvfp4_backend: cutlass
  torch: 2.15.0.dev+cu130
  capture: torch.cuda.CUDAGraph
workload:
  n: 4096
  k: 4096
  warmups: [30, 30, 20]
  iterations: [500, 300, 200]
  independent_process_repeats: 2
  operation: activation_scaled_fp4_quant_then_cutlass_scaled_fp4_mm
cells:
  - m: 1
    regular_pipeline_ms: 0.026705
    regular_pipeline_ms_range: [0.025380, 0.028030]
    cuda_graph_pipeline_ms: 0.019366
    cuda_graph_pipeline_ms_range: [0.018554, 0.020178]
    pipeline_reduction_percent: 27.5
    fp16_mm_ms: 0.020757
    graph_speedup_vs_fp16: 1.083
    graph_max_abs_error_vs_pipeline: 0.0
  - m: 32
    regular_pipeline_ms: 0.025690
    regular_pipeline_ms_range: [0.025103, 0.026276]
    cuda_graph_pipeline_ms: 0.018615
    cuda_graph_pipeline_ms_range: [0.018328, 0.018901]
    pipeline_reduction_percent: 27.5
    fp16_mm_ms: 0.024887
    graph_speedup_vs_fp16: 1.341
    graph_max_abs_error_vs_pipeline: 0.0
  - m: 128
    regular_pipeline_ms: 0.029011
    regular_pipeline_ms_range: [0.028543, 0.029480]
    cuda_graph_pipeline_ms: 0.018577
    cuda_graph_pipeline_ms_range: [0.018393, 0.018760]
    pipeline_reduction_percent: 36.0
    fp16_mm_ms: 0.028674
    graph_speedup_vs_fp16: 1.544
    graph_max_abs_error_vs_pipeline: 0.0
decision: Across two independent process repeats, CUDA Graph capture removes roughly 27--36% of activation-quantization pipeline time at the measured decode-like shapes while matching the regular pipeline bit-for-bit. This is a shape-static serving optimization; it must be integrated with request-shape bucketing and recaptured on shape changes before production use.
cache_behavior:
  capture_ms_by_m: {1: 23.09, 32: 23.08, 128: 18.54}
  replay_break_even_by_m: {1: 3800, 32: 3769, 128: 3367}
  lookup_stats_by_bucket: {buckets: 1, captures: 1, hits: 1}
  note: Capture cost is amortized only after roughly 3.4k--3.8k replays for these cells; a serving integration should retain buckets across many decode steps.
evidence:
  matrix_runner: KAIRO_NVFP4_GRAPH_REPEATS=2 bash scripts/wsl/run_nvfp4_graph_matrix.sh .kairo-local/nvfp4-graph-repeats2.jsonl
  analyzer: python scripts/wsl/analyze_nvfp4_graph.py .kairo-local/nvfp4-graph-repeats2.jsonl
  raw_matrix: .kairo-local/nvfp4-graph-repeats2.jsonl
  cache_probe_raw: .kairo-local/nvfp4-graph-cache-matrix.jsonl
  commands:
    - bash scripts/wsl/run_nvfp4_probe.sh --m 1 --n 4096 --k 4096 --iterations 500 --warmups 30 --cuda-graph
    - bash scripts/wsl/run_nvfp4_probe.sh --m 32 --n 4096 --k 4096 --iterations 300 --warmups 30 --cuda-graph
    - bash scripts/wsl/run_nvfp4_probe.sh --m 128 --n 4096 --k 4096 --iterations 200 --warmups 20 --cuda-graph
