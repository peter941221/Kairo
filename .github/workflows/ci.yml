name: kairo-lab-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install manifest parser
        run: python -m pip install --upgrade pip pyyaml
      - name: Run dependency-light unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q
      - name: Parse every experiment manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path("experiments").rglob("*.yaml"))
          for path in paths:
              yaml.safe_load(path.read_text(encoding="utf-8"))
          print(f"parsed {len(paths)} YAML manifests")
          PY
      - name: Check WSL entry-point syntax
        run: bash -n scripts/wsl/*.sh
