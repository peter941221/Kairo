decision: Interleaved ordering confirms a strong and repeatable M=128 gain, while M=1 is marginal and M=8--64 are timing-sensitive across process launches. Do not hard-code a universal crossover; use per-shape repeated measurements and include quantization overhead before routing production decode batches.
