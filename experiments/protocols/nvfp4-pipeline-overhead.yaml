decision: "Activation quantization changes the optimization target: pre-quantized NVFP4 GEMM is fast, but including per-call activation quantization removes the gain at M=1 and M=128. A Kairo win must fuse or materially reduce quantization overhead rather than only wrapping the vendor GEMM."
