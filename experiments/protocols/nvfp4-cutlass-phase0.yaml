decision: The installed vendor NVFP4 path is available on SM120 and reaches 183 TFLOP/s at M=128, about 38% above the FP16 cuBLAS control for that shape. M=1 remains launch-bound at 1.29 TFLOP/s. Quantization error versus the original FP16 weights/activations is about 13--14% relative mean and must be validated at model level; this is a baseline and a high-value target, not yet a Kairo-owned kernel claim.
