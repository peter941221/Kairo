decision: TMA integration is correct and improves the 4K WMMA path by about 1.5x, but remains behind cuBLAS. The first double-buffered control is also correct but slower than the single-buffer baseline (about 8% at 1K and 3% at 4K); keep it only as a regression fixture. The m128 variant is correct across square and rectangular checks and improves the single-buffer path by about 8% on the rectangular cell and 11--13% on 4K square, so it is the leading aligned-shape candidate. Do not route all workloads to it until more boundary and occupancy cells are measured.
