decision: The installed vendor NVFP4 path is available on SM120. In same-process comparisons CUTLASS beats FP16 by 10.5% at M=1 and 38--46% at M=128, but loses by 15% at M=32; B12X is 67--79% slower than FP16 on all checked cells. Keep backend selection shape-aware and treat these vendor paths as baselines, not Kairo-owned kernel claims. Quantization error versus the original FP16 operands is about 13--14% relative mean and must be validated at model level.
