[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-lab"
version = "0.1.0"
description = "Reproducible Blackwell inference-kernel experiment workbench"
requires-python = ">=3.10"

[project.scripts]
kairo-lab = "kairo_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
